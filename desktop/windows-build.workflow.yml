# Source template for the active workflow in .github/workflows/windows-build.yml.
# Stores an unsigned artifact; does not publish a GitHub Release.
name: Windows prototype installer
on:
  push:
    branches: [main, "candidate/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Verify pinned build Node
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TOOL_CACHE 'node/24.21.0/x64/node.exe'
          $actual = (& node -p 'process.execPath').Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($actual) -ine [IO.Path]::GetFullPath($expected)) { throw 'PATH does not select the pinned setup-node executable.' }
          $version = (& $expected --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'v24.21.0') { throw 'Unexpected build Node version.' }
          Write-Output "Build Node: $expected ($version)"
      - name: Check OpenSSL for local TLS test fixtures
        shell: pwsh
        run: |
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            $gitOpenSSL = Join-Path $env:ProgramFiles 'Git\usr\bin\openssl.exe'
            if (Test-Path $gitOpenSSL) {
              Split-Path $gitOpenSSL | Out-File -FilePath $env:GITHUB_PATH -Append
              & $gitOpenSSL version
            } else {
              throw 'OpenSSL CLI is required only for TLS fixture tests. Install a trusted OpenSSL distribution or Git for Windows before running this workflow.'
            }
          } else {
            & $openssl.Source version
          }
      - run: npm ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run install:runtime
      - run: npx playwright install chromium
      - name: Test real 60-second idle and live DOM stability
        shell: pwsh
        run: node tests/ui-stability-60s.mjs --require-windows --output-dir (Join-Path $env:RUNNER_TEMP 'luheng-ui-stability-proof')
        timeout-minutes: 5
      - name: Test backend with serialized test files
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - run: npm --prefix desktop run check
      - name: Test generic chat, Skills, tools, attachments and responsive UI
        run: node tests/generic-chat-ui.mjs
        timeout-minutes: 8
      - name: Test local file and command permission UI
        shell: pwsh
        run: node tests/ui-local-access.mjs --output-dir (Join-Path $env:RUNNER_TEMP 'luheng-ui-local-proof')
        timeout-minutes: 8
      - name: Test existing mail and controlled-browser approval UI
        shell: pwsh
        run: node tests/existing-integrations-ui.mjs --output-dir (Join-Path $env:RUNNER_TEMP 'luheng-existing-integrations-proof')
        timeout-minutes: 10
      - name: Test retained chat recovery, schedules, credentials and Office UI
        shell: pwsh
        run: node tests/retained-chat-settings-ui.mjs --require-windows --output-dir (Join-Path $env:RUNNER_TEMP 'luheng-retained-ui-proof')
        timeout-minutes: 12
      - name: Test bounded live default public-web tools
        shell: pwsh
        run: node tests/public-web-live-smoke.mjs --require-windows --output-dir (Join-Path $env:RUNNER_TEMP 'luheng-public-web-live-proof')
        timeout-minutes: 3
      - name: Upload isolated UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luheng-ui-verification-${{ github.sha }}
          path: |
            artifacts/screenshots/
            artifacts/screenshots-v03/
            artifacts/redesign/
            artifacts/recovery/
            ${{ runner.temp }}/luheng-ui-local-proof/
            ${{ runner.temp }}/luheng-ui-stability-proof/
            ${{ runner.temp }}/luheng-existing-integrations-proof/
            ${{ runner.temp }}/luheng-retained-ui-proof/
            ${{ runner.temp }}/luheng-public-web-live-proof/
          if-no-files-found: warn
          retention-days: 14
      - run: npm --prefix desktop run package:win
      - name: Verify native Windows installer and bundled runtime
        shell: pwsh
        timeout-minutes: 15
        run: ./scripts/verify-windows-native.ps1
      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luheng-windows-verification-${{ github.sha }}
          path: desktop/dist/native-smoke/*.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: luheng-windows-unsigned-prototype
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
