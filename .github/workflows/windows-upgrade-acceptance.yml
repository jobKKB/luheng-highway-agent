# Manual-only acceptance of the LOCKED 0.4.0 -> 0.5.0 per-user upgrade on a
# disposable GitHub-hosted Windows runner. Downloads only the two artifacts
# pinned in scripts/windows-upgrade-lock.json (id + run + commit + SHA-256);
# never "latest". Builds nothing, publishes nothing, creates no Release.
name: Windows upgrade acceptance (locked 0.4.0 -> 0.5.0)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-upgrade-acceptance
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify pinned Node
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TOOL_CACHE 'node/24.21.0/x64/node.exe'
          $actual = (& node -p 'process.execPath').Trim()
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFullPath($actual) -ine [IO.Path]::GetFullPath($expected)) { throw 'PATH does not select the pinned setup-node executable.' }
          $version = (& $expected --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'v24.21.0') { throw 'Unexpected Node version.' }
          Write-Output "Node: $expected ($version)"
      - name: Fetch and verify locked installers (fail closed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'luheng-upgrade-inputs'
          [void](New-Item -ItemType Directory -Path 'upgrade-evidence-inputs')
          node scripts/verify-windows-upgrade.mjs fetch --lock scripts/windows-upgrade-lock.json --out $out --report upgrade-evidence-inputs/locked-inputs.json
          if ($LASTEXITCODE -ne 0) { throw 'Locked input verification failed.' }
      - name: Upgrade, interrupted recovery and reinstall acceptance
        shell: pwsh
        timeout-minutes: 45
        run: ./scripts/verify-windows-upgrade.ps1 -InputDirectory (Join-Path $env:RUNNER_TEMP 'luheng-upgrade-inputs')
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luheng-windows-upgrade-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            upgrade-evidence-inputs/
            upgrade-evidence/
          if-no-files-found: warn
          retention-days: 14
