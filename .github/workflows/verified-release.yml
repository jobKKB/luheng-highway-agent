# Fixed, reviewed 0.5.2 publication only. PRs cannot invoke this write job.
name: Publish verified Windows 0.5.2 prerelease
on:
  push:
    branches: [main]
    paths: ['.github/release/release-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-public-release-v0.5.2
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'jobKKB/luheng-highway-agent' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency install, external action, build or artifact script.
      # Anonymous fetch from the exact trusted main event SHA; hardcoded digests.
      - name: Fetch reviewed publisher files from this trusted main commit
        env:
          LOCK_SHA256: 7e6e6f80691bbf9e8fa6ac7df3c429a2227c3d766640735107ded8d34a0e2ad7
          PUBLISHER_SHA256: af4f55f0ac7556e4bb20eab67b0cd6ed91a8a2d56c72e84c35d45cb4e588733b
          TESTS_SHA256: dbb698673f4b16d79d3d7c54aa39f90779e92759a8836a5e08e77bf14e7cc0bb
        run: |
          python3 -I - <<'PYCODE'
          import hashlib, os, pathlib, re, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'jobKKB/luheng-highway-agent'
          assert os.environ['GITHUB_REPOSITORY_ID'] == '1400818714'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch')
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          root = pathlib.Path('.github/release')
          root.mkdir(parents=True, exist_ok=True)
          for filename, expected in [('release-lock.json', os.environ['LOCK_SHA256']), ('publish_verified_release.py', os.environ['PUBLISHER_SHA256']), ('test_publish_verified_release.py', os.environ['TESTS_SHA256'])]:
              url = 'https://raw.githubusercontent.com/jobKKB/luheng-highway-agent/' + sha + '/.github/release/' + filename
              with urllib.request.urlopen(url, timeout=60) as response:
                  raw = response.read(256 * 1024 + 1)
              assert len(raw) <= 256 * 1024
              assert hashlib.sha256(raw).hexdigest() == expected, 'Trusted publisher file digest mismatch'
              (root / filename).write_bytes(raw)
          PYCODE
      - name: Run offline fail-closed publisher unit tests without a token
        run: python3 -I .github/release/test_publish_verified_release.py -v
      - name: Verify locked build and evidence, publish, then anonymously verify all bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I .github/release/publish_verified_release.py
