# Fixed, reviewed 0.6.0-beta.1 internal publication only. PRs cannot invoke this write job.
name: Publish verified Windows 0.6.0-beta.1 internal prerelease
on:
  push:
    branches: [main]
    paths: ['.github/release/release-lock-beta1.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-internal-release-v0.6.0-beta.1
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'jobKKB/luheng-highway-agent' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency install, external action, build or artifact script.
      # Anonymous fetch from the exact trusted main event SHA; hardcoded digests.
      - name: Fetch reviewed publisher files from this trusted main commit
        env:
          LOCK_SHA256: d4f59a84435baae66e49ab8f00e28c5101e4f2d1a27ad5ad4bfcb39949508f5d
          PUBLISHER_SHA256: 3e94575eeff13d863d558f62a432d0a5522409d70141b3c2af00d98f9d3c82e5
          TESTS_SHA256: b3474f3ce40df76d501ebd3032aef92ac63d6c7a37840d0f2705fca2091f04c7
        run: |
          python3 -I - <<'PYCODE'
          import hashlib, os, pathlib, re, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'jobKKB/luheng-highway-agent'
          assert os.environ['GITHUB_REPOSITORY_ID'] == '1400818714'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch')
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          root = pathlib.Path('.github/release')
          root.mkdir(parents=True, exist_ok=True)
          for filename, expected in [('release-lock-beta1.json', os.environ['LOCK_SHA256']), ('publish_verified_beta1.py', os.environ['PUBLISHER_SHA256']), ('test_publish_verified_beta1.py', os.environ['TESTS_SHA256'])]:
              url = 'https://raw.githubusercontent.com/jobKKB/luheng-highway-agent/' + sha + '/.github/release/' + filename
              with urllib.request.urlopen(url, timeout=60) as response:
                  raw = response.read(256 * 1024 + 1)
              assert len(raw) <= 256 * 1024
              assert hashlib.sha256(raw).hexdigest() == expected, 'Trusted publisher file digest mismatch'
              (root / filename).write_bytes(raw)
          PYCODE
      - name: Run offline fail-closed publisher unit tests without a token
        run: python3 -I .github/release/test_publish_verified_beta1.py -v
      - name: Verify locked build and evidence, publish, then anonymously verify all bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I .github/release/publish_verified_beta1.py
