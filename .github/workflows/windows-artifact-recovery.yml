name: Luheng retained Windows installer acceptance
on:
  push:
    branches: [codex/windows-release-completion]
    paths:
      - qa/release-windows/recovery-locks/qualified-0.7.0.json
      - qa/release-windows/recovery-locks/qualified-0.7.1.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-artifact-recovery
  cancel-in-progress: false
jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        version: ['0.7.0', '0.7.1']
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Checkout committed acceptance helpers
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Select managed Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: false
          python-version: '3.12'
      - name: Check custody and retained native process handles before downloading
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/selftest-artifact-recovery.py
          if ($LASTEXITCODE) { throw 'Recovery admission self-test failed' }
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/selftest-lifecycle.py
          if ($LASTEXITCODE) { throw 'Lifecycle custody self-test failed' }
          $job = Join-Path $env:RUNNER_TEMP 'recovery-helper-check'
          New-Item -ItemType Directory -Path $job | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $job /grant "*${sid}:(OI)(CI)F" /T
          if ($LASTEXITCODE) { throw 'Restricted helper directory permissions failed' }
          $argsLine = '-OutputDirectory "' + (Join-Path $job 'evidence') + '"'
          & qa/native-installer-consumer/token-review/Run-RestrictedLifecycle.ps1 -ProbeScript (Join-Path $env:GITHUB_WORKSPACE 'qa/native-installer-consumer/Test-LifecycleProcessOwner.ps1') -PowerShellExecutable (Get-Command pwsh).Source -ProbeArgumentLine $argsLine -WorkingDirectory $job -EvidencePath (Join-Path $job 'restricted-token.json') -TimeoutSeconds 180 -ExtraEnvironment @{RUNNER_TEMP=$env:RUNNER_TEMP;GITHUB_ACTIONS='true';GITHUB_RUN_ID=$env:GITHUB_RUN_ID;GITHUB_SHA=$env:GITHUB_SHA} -ExecuteProbe
      - name: Admit the exact completed producer and digest-pinned artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = "qa/release-windows/recovery-locks/qualified-$env:PRODUCT_VERSION.json"
          git ls-files --error-unmatch -- $lock
          if ($LASTEXITCODE) { throw 'Recovery lock must be committed' }
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/artifact-recovery.py admit --lock $lock --context (Join-Path $env:RUNNER_TEMP 'recovery-context.json')
          if ($LASTEXITCODE) { throw 'Original producer did not qualify for recovery' }
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/artifact-recovery.py download --context (Join-Path $env:RUNNER_TEMP 'recovery-context.json') --raw-evidence (Join-Path $env:RUNNER_TEMP 'recovery-raw/evidence') --raw-installer (Join-Path $env:RUNNER_TEMP 'recovery-raw/installer')
          if ($LASTEXITCODE) { throw 'Pinned archive download or digest validation failed' }
      - name: Bind unchanged original evidence to this acceptance execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'recovery-evidence'
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/artifact-recovery.py prepare --context (Join-Path $env:RUNNER_TEMP 'recovery-context.json') --raw-evidence (Join-Path $env:RUNNER_TEMP 'recovery-raw/evidence') --raw-installer (Join-Path $env:RUNNER_TEMP 'recovery-raw/installer') --evidence $evidence
          if ($LASTEXITCODE) { throw 'Immutable artifact preparation failed' }
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/prepare-lifecycle-contract.py --evidence $evidence --build-receipt (Join-Path $evidence 'producer/installer-build.json') --recovery-admission (Join-Path $evidence 'recovery-admission.json') --output (Join-Path $evidence 'lifecycle-contract.json')
          if ($LASTEXITCODE) { throw 'Recovered lifecycle contract failed' }
      - name: Install verify every file launch close and uninstall using a restricted token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'recovery-evidence'
          $job = Join-Path $env:RUNNER_TEMP 'recovery-lifecycle'
          New-Item -ItemType Directory -Force (Join-Path $job 'evidence') | Out-Null
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls $job /grant "*${sid}:(OI)(CI)F" /T
          if ($LASTEXITCODE) { throw 'Restricted acceptance directory permissions failed' }
          $python = (uv python find 3.12).Trim()
          if ($LASTEXITCODE) { throw 'Managed interpreter unavailable' }
          $qa = Join-Path $env:GITHUB_WORKSPACE 'qa'
          $arguments = '-Contract "' + (Join-Path $evidence 'lifecycle-contract.json') + '" -BuildReceipt "' + (Join-Path $evidence 'producer/installer-build.json') + '" -OriginalEvidence "' + $evidence + '" -JobRoot "' + $job + '" -Verifier "' + (Join-Path $qa 'release-windows/verify-installed-tree.py') + '" -PythonExecutable "' + $python + '"'
          & (Join-Path $qa 'native-installer-consumer/token-review/Run-RestrictedLifecycle.ps1') -ProbeScript (Join-Path $qa 'native-installer-consumer/Invoke-InstallerLifecycle.ps1') -PowerShellExecutable (Get-Command pwsh).Source -ProbeArgumentLine $arguments -WorkingDirectory $job -EvidencePath (Join-Path $job 'evidence/restricted-token.json') -TimeoutSeconds 1500 -ExtraEnvironment @{RUNNER_TEMP=$env:RUNNER_TEMP;GITHUB_ACTIONS='true';GITHUB_RUN_ID=$env:GITHUB_RUN_ID;GITHUB_SHA=$env:GITHUB_SHA;GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT} -ExecuteProbe
          uv run --no-project --python 3.12 python -I -S -B qa/release-windows/artifact-recovery.py seal --evidence $evidence --lifecycle (Join-Path $job 'evidence/installer-lifecycle.json')
          if ($LASTEXITCODE) { throw 'Actual recovery acceptance did not qualify' }
      - name: Preserve provenance and diagnostics without republishing the installer
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: luheng-windows-recovery-evidence-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/recovery-evidence/producer/**
            ${{ runner.temp }}/recovery-evidence/acceptance/**
            ${{ runner.temp }}/recovery-evidence/recovery-admission.json
            ${{ runner.temp }}/recovery-evidence/lifecycle-contract.json
            ${{ runner.temp }}/recovery-helper-check/**
            ${{ runner.temp }}/recovery-lifecycle/evidence/**
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
