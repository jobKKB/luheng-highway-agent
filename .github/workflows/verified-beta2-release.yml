# Fixed, reviewed 0.6.0-beta.2 internal publication only. PRs cannot invoke this write job.
name: Publish verified Windows 0.6.0-beta.2 internal prerelease
on:
  push:
    branches: [main]
    paths: ['.github/release/release-lock-beta2.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-internal-release-v0.6.0-beta.2
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'jobKKB/luheng-highway-agent' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency install, external action, build or artifact script.
      # Anonymous fetch from the exact trusted main event SHA; hardcoded digests.
      - name: Fetch reviewed publisher files from this trusted main commit
        env:
          LOCK_SHA256: 238104d305babc5248ef35ae564f106bf2b047a08e61882c3a8a1e42095b5245
          PUBLISHER_SHA256: 5845769878db58ce5d7b7c45007ab060fd39f1c8ddda6d331ba2b8370574b2df
          TESTS_SHA256: 1bd6ab6f038041fe089a540814ad974825805f4f815c2f16ba72c72b5703acad
        run: |
          python3 -I - <<'PYCODE'
          import hashlib, os, pathlib, re, urllib.request
          assert os.environ['GITHUB_REPOSITORY'] == 'jobKKB/luheng-highway-agent'
          assert os.environ['GITHUB_REPOSITORY_ID'] == '1400818714'
          assert os.environ['GITHUB_REF'] == 'refs/heads/main'
          assert os.environ['GITHUB_EVENT_NAME'] in ('push', 'workflow_dispatch')
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          root = pathlib.Path('.github/release')
          root.mkdir(parents=True, exist_ok=True)
          for filename, expected in [('release-lock-beta2.json', os.environ['LOCK_SHA256']), ('publish_verified_beta2.py', os.environ['PUBLISHER_SHA256']), ('test_publish_verified_beta2.py', os.environ['TESTS_SHA256'])]:
              url = 'https://raw.githubusercontent.com/jobKKB/luheng-highway-agent/' + sha + '/.github/release/' + filename
              with urllib.request.urlopen(url, timeout=60) as response:
                  raw = response.read(256 * 1024 + 1)
              assert len(raw) <= 256 * 1024
              assert hashlib.sha256(raw).hexdigest() == expected, 'Trusted publisher file digest mismatch'
              (root / filename).write_bytes(raw)
          PYCODE
      - name: Run offline fail-closed publisher unit tests without a token
        run: python3 -I .github/release/test_publish_verified_beta2.py -v
      - name: Verify locked build and evidence, publish, then anonymously verify all bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I .github/release/publish_verified_beta2.py
