name: Luheng complete Windows candidate build, round-trip and native startup
permissions:
  contents: read
concurrency:
  group: luheng-pinned-unpacked-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
    - name: Checkout approved source-only controller
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false
        path: controller
    - name: Checkout immutable official source
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: NousResearch/hermes-agent
        ref: 158fd638da1629c8e62caf9ade1515d162def8ab
        persist-credentials: false
        path: source
    - name: Select host Python for official preparation
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Reconstruct and admit the exact current source-only candidate
      shell: pwsh
      run: 'python controller/qa/hermes-native/materialize-v2-source.py controller source

        if ($LASTEXITCODE) { throw ''Exact source admission failed; no build claim is made'' }

        '
    - name: Prepare locked native Windows inputs and build an unpacked artifact
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne ''X64'') { throw ''Native Windows x64 is required'' }

        $source = Join-Path $env:GITHUB_WORKSPACE ''source''

        $job = Join-Path $env:RUNNER_TEMP ''luheng-current-unpacked-build''

        New-Item -ItemType Directory -Force $job | Out-Null

        $env:HERMES_HOME = Join-Path $job ''parent-hermes-home''

        $env:HERMES_RUNTIME_DIR = Join-Path $job ''parent-tools''

        $env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $job ''electron-user-data''

        $env:CSC_IDENTITY_AUTO_DISCOVERY = ''false''

        foreach ($name in @(''AZURE_SIGN_ENDPOINT'', ''AZURE_CLIENT_ID'', ''AZURE_SIGN_PUBLISHER'', ''AZURE_TENANT_ID'', ''AZURE_CLIENT_SECRET'', ''CSC_LINK'', ''CSC_KEY_PASSWORD'', ''APPLE_ID'', ''APPLE_APP_SPECIFIC_PASSWORD'', ''GH_TOKEN'', ''GITHUB_TOKEN'')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }

        Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free | ConvertTo-Json | Set-Content (Join-Path $env:GITHUB_WORKSPACE ''disk-before.json'')

        $sha = (Get-Content (Join-Path $env:GITHUB_WORKSPACE ''admitted-source-sha.txt'')).Trim()

        Set-Location $source

        python -I -S scripts/bundles/desktop.py --repo $source --commit $sha --variant bundled --prepare-only --work (Join-Path $job ''work'') --cache (Join-Path $job ''cache'') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE ''prepare.log'')

        if ($LASTEXITCODE) { throw ''Official native preparation failed; no artifact is claimed'' }

        python -I -S scripts/bundles/desktop.py --prepared (Join-Path $job ''work/prepared.json'') -- --dir 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE ''unpacked-build.log'')

        if ($LASTEXITCODE) { throw ''Official prepared unpacked build failed'' }

        '
    - name: Bind the unpacked structure and hashes to the source admission
      shell: pwsh
      run: 'python controller/qa/hermes-native/verify-contained-candidate.py source (Join-Path $env:RUNNER_TEMP ''luheng-current-unpacked-build/work/prepared.json'')

        if ($LASTEXITCODE) { throw ''Unpacked structure check failed; installation and startup remain unverified'' }

        '
    - name: Package every verified file including hidden runtime metadata
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$out = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence'\nNew-Item -ItemType Directory -Force $out | Out-Null\n$code = @'\nfrom pathlib import Path,PurePosixPath\nimport json,zipfile,hashlib,collections,sys,os\nsource=Path(sys.argv[1]);root=source/'apps/desktop/release/win-unpacked';out=Path(sys.argv[2]);dest=Path(sys.argv[3]);report=json.loads((source.parent/'windows-unpacked-structure.json').read_text(encoding='utf-8-sig'))\nexpected={row['path']:row for row in report['files']};archive=source.parent/'Luheng-Windows-x64-complete.zip';groups=collections.defaultdict(lambda:[0,0])\nwith zipfile.ZipFile(archive,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as z:\n    for name,row in expected.items():\n        parts=PurePosixPath(name).parts\n        assert not PurePosixPath(name).is_absolute() and all(p not in ('','.','..') for p in parts) and '\\\\' not in name and ':' not in name\n        p=root.joinpath(*parts);assert\
        \ p.is_file() and not p.is_symlink() and not p.is_junction()\n        z.write(p,'Luheng-Windows-x64/'+name)\n        key='/'.join(parts[:4]);groups[key][0]+=row['bytes'];groups[key][1]+=1\nwith archive.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()\nwith zipfile.ZipFile(archive) as z:\n    assert len(z.namelist())==len(expected) and len(set(z.namelist()))==len(expected)\n    for name,row in expected.items():\n        with z.open('Luheng-Windows-x64/'+name) as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']\n    z.extractall(dest)\nrestored=dest/'Luheng-Windows-x64';actual={p.relative_to(restored).as_posix() for p in restored.rglob('*') if p.is_file()}\nassert actual==set(expected)\nfor name,row in expected.items():\n    p=restored/name;assert p.stat().st_size==row['bytes']\n    with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']\nresult={'zip':archive.name,'bytes':archive.stat().st_size,'sha256':digest,'files':len(expected),'all_hidden_files_included':True,'roundtrip_every_file_sha256_verified':True,'source_commit':report['source_commit'],'source_tree_sha256':report['source_tree_sha256'],'under_2_GiB':archive.stat().st_size<2*1024**3,'unsigned':True,'installation_verified':False}\n\
        (out/'compressed-roundtrip.json').write_text(json.dumps(result,indent=2)+'\\n');(out/'package-size.json').write_text(json.dumps({'total_bytes':sum(r['bytes'] for r in expected.values()),'groups':[{'path':k,'bytes':v[0],'files':v[1]} for k,v in sorted(groups.items(),key=lambda r:r[1][0],reverse=True)]},indent=2)+'\\n')\n(source.parent/'SHA256SUMS').write_text(digest+'  '+archive.name+'\\n')\nprint(json.dumps(result));print('Largest groups',sorted(groups.items(),key=lambda r:r[1][0],reverse=True)[:12])\n'@\n$script = Join-Path $env:RUNNER_TEMP 'package-and-verify-roundtrip.py'\n$code | Set-Content -Encoding utf8 $script\npython -I -S $script (Join-Path $env:GITHUB_WORKSPACE 'source') $out (Join-Path $env:RUNNER_TEMP 'luheng-roundtrip-package')\nif ($LASTEXITCODE) { throw 'Complete archive round-trip failed' }"
    - name: Exercise a plain native window and contained backend health
      if: success()
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$root = Join-Path $env:RUNNER_TEMP 'luheng-roundtrip-package/Luheng-Windows-x64'\n$exe = [IO.Path]::GetFullPath((Join-Path $root 'LuhengOfficeAgent.exe'))\n$out = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence'\n$state = Join-Path $env:RUNNER_TEMP 'luheng-smoke-private-state'\nNew-Item -ItemType Directory -Force $state | Out-Null\n$env:HERMES_HOME = Join-Path $state 'home'\n$env:HERMES_RUNTIME_DIR = Join-Path $state 'parent-tools'\n$env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $state 'electron-user-data'\n$env:ELECTRON_ENABLE_LOGGING = '1'\nforeach ($item in @(Get-ChildItem Env:)) { if ($item.Name -match '(TOKEN|SECRET|PASSWORD|API_KEY|CSC_LINK|AZURE_SIGN|APPLE_ID)') { Remove-Item \"Env:$($item.Name)\" -ErrorAction SilentlyContinue } }\n$result = [ordered]@{ build_run_id=$env:GITHUB_RUN_ID; native_windows=$true; architecture=[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString(); plain_launch=$false; contained_backend_health=$false;\
        \ normal_window_close=$false; forced_cleanup=$false; offline_verified=$false; physical_ime_verified=$false; installation_verified=$false; error=$null }\ntry {\n  $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru -RedirectStandardOutput (Join-Path $out 'desktop-stdout.log') -RedirectStandardError (Join-Path $out 'desktop-stderr.log')\n  $deadline = (Get-Date).AddSeconds(180)\n  $window = $null\n  do {\n    $owned = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\\',[StringComparison]::OrdinalIgnoreCase) })\n    $windows = @($owned | Where-Object { [IO.Path]::GetFullPath($_.ExecutablePath) -ieq $exe } | ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue } | Where-Object { $_.MainWindowHandle -ne 0 })\n    if ($windows.Count -eq 1) { $window=$windows[0];$result.plain_launch=$true;$result.window_title=$window.MainWindowTitle }\n    $ids=@($owned.ProcessId)\n\
        \    foreach ($listener in @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in $ids -and $_.LocalAddress -in @('127.0.0.1','0.0.0.0','::1','::') })) {\n      try { $health=Invoke-RestMethod -Uri \"http://127.0.0.1:$($listener.LocalPort)/api/health\" -TimeoutSec 2; if ($health.ok -eq $true -and $health.version -eq '0.0.0') { $result.contained_backend_health=$true;$result.health_version=$health.version;$result.backend_pid=$listener.OwningProcess;break } } catch {}\n    }\n    if ($result.plain_launch -and $result.contained_backend_health) { break }\n    Start-Sleep -Milliseconds 750\n  } while ((Get-Date) -lt $deadline)\n  if (-not $result.plain_launch -or -not $result.contained_backend_health) { throw 'Native window or contained backend health did not become ready' }\n  Add-Type -AssemblyName System.Windows.Forms\n  Add-Type -AssemblyName System.Drawing\n  $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds\n  $bitmap=[System.Drawing.Bitmap]::new($bounds.Width,$bounds.Height)\n\
        \  $graphics=[System.Drawing.Graphics]::FromImage($bitmap)\n  $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)\n  $bitmap.Save((Join-Path $out 'native-window.png'),[System.Drawing.Imaging.ImageFormat]::Png)\n  $graphics.Dispose();$bitmap.Dispose()\n  Start-Sleep -Seconds 15\n  $result.normal_window_close=$window.CloseMainWindow()\n  if ($result.normal_window_close) { $result.normal_window_close=$window.WaitForExit(30000) }\n} catch { $result.error=$_.Exception.Message } finally {\n  $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\\',[StringComparison]::OrdinalIgnoreCase) })\n  if ($remaining.Count) { $result.forced_cleanup=$true; $remaining | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }\n  $result | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'native-startup.json')\n  $result\
        \ | ConvertTo-Json -Depth 8 | Write-Output\n}\nif ($result.error -or -not $result.plain_launch -or -not $result.contained_backend_health) { throw 'Native startup smoke failed; inspect isolated diagnostics' }\n"
    - name: Losslessly measure stronger compression when standard ZIP exceeds asset size
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$out = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence'\n$proof = Get-Content (Join-Path $out 'compressed-roundtrip.json') -Raw | ConvertFrom-Json\nif (-not $proof.under_2_GiB) {\n  $sevenZip = Get-Command 7z -ErrorAction Stop\n  $archive = Join-Path $env:GITHUB_WORKSPACE 'Luheng-Windows-x64-complete.7z'\n  Push-Location (Join-Path $env:RUNNER_TEMP 'luheng-roundtrip-package')\n  & $sevenZip.Source a -t7z -mx=9 -m0=lzma2 -ms=on $archive 'Luheng-Windows-x64'\n  if ($LASTEXITCODE) { throw 'Lossless 7z compression failed' }\n  & $sevenZip.Source t $archive\n  if ($LASTEXITCODE) { throw '7z internal integrity failed' }\n  Pop-Location\n  [ordered]@{ archive='Luheng-Windows-x64-complete.7z'; bytes=(Get-Item $archive).Length; sha256=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLower(); under_2_GiB=((Get-Item $archive).Length -lt 2GB); removes_no_tools_or_cache=$true; standard_windows_zip_roundtrip_already_verified=$true; seven_zip_extraction_hashes_verified=$false\
        \ } | ConvertTo-Json | Set-Content (Join-Path $out 'strong-compression-measurement.json')\n}"
    - name: Preserve complete user archives and precise build and startup evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-complete-windows-x64-candidate
        retention-days: 7
        compression-level: 0
        if-no-files-found: warn
        path: 'Luheng-Windows-x64-complete.zip

          Luheng-Windows-x64-complete.7z

          SHA256SUMS

          admitted-source-sha.txt

          source-admission.json

          windows-unpacked-structure.json

          native-smoke-evidence/**

          prepare.log

          unpacked-build.log

          '
        include-hidden-files: true
'on':
  push:
    branches:
    - probe/hermes-native-package-current-20261006
    paths:
    - .github/workflows/hermes-native-package-experiment.yml
    - qa/hermes-native/**
  workflow_dispatch: null
