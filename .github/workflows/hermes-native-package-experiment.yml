name: Luheng existing Windows artifact integrity and native startup
on:
  push:
    branches: [probe/hermes-native-package-current-20261006]
    paths: [.github/workflows/hermes-native-package-experiment.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: luheng-existing-artifact-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-artifact-smoke:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check exact build artifact identity and available disk
        shell: pwsh
        env:
          READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'luheng-smoke-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $a = Invoke-RestMethod -Uri 'https://api.github.com/repos/jobKKB/luheng-highway-agent/actions/artifacts/11522330720' -Headers @{ Authorization = "Bearer $env:READ_TOKEN"; Accept = 'application/vnd.github+json' }
          if ($a.expired -or $a.size_in_bytes -ne 6546662625 -or $a.digest -ne 'sha256:41fbc7357a0694dafe557f6b0efe31246e30c1d97caeb46aa9359425094f0adc' -or $a.workflow_run.id -ne 37709883960 -or $a.workflow_run.head_sha -ne '7bd266a449d90b1823711159dbd33718f9ca223f') { throw 'Exact artifact identity differs' }
          $a | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $out 'artifact-identity.json')
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free | ConvertTo-Json | Set-Content (Join-Path $out 'disk-before.json')
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd('\').TrimEnd(':'))
          if ($drive.Free -lt 20GB) { throw 'Less than 20 GiB of scratch space; refusing duplicate expansion' }
      - name: Consume the existing build without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11522330720'
          run-id: '37709883960'
          repository: jobKKB/luheng-highway-agent
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/luheng-existing-candidate
          merge-multiple: true
      - name: Select an independent verifier interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify every uploaded package file against native build evidence
        id: integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $code = @'
          from pathlib import Path, PurePosixPath
          import hashlib,json,sys,collections
          base=Path(sys.argv[1]);out=Path(sys.argv[2]);root=base/'source/apps/desktop/release/win-unpacked'
          report=json.loads((base/'windows-unpacked-structure.json').read_text(encoding='utf-8-sig'))
          admission=json.loads((base/'source-admission.json').read_text(encoding='utf-8-sig'))
          assert report['source_commit']==admission['source_commit']=='ef5e99a3a76707bb4e5a5a3915e4cb35c53714d6'
          assert report['source_tree_sha256']==admission['source_tree_sha256']=='e8728b0ff4c3a1433daedb8d7bc3db9c01bb8d93f3775f3049461b899d363d03'
          assert report['source_count']==17256 and report['structural_only'] and not report['production_update_enabled']
          expected={r['path']:r for r in report['files']};missing=[];bad=[];sizes=collections.defaultdict(lambda:[0,0]);actual=set()
          for n,row in expected.items():
              parts=PurePosixPath(n).parts
              assert n and not PurePosixPath(n).is_absolute() and all(p not in ('','.','..') for p in parts) and '\\' not in n and ':' not in n
              p=root.joinpath(*parts)
              if not p.is_file():missing.append(n);continue
              if p.is_symlink() or p.is_junction() or p.stat().st_size!=row['bytes']:
                  bad.append(n);continue
              with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
              if digest!=row['sha256']:bad.append(n)
              key='/'.join(parts[:4]);sizes[key][0]+=p.stat().st_size;sizes[key][1]+=1
          for p in root.rglob('*'):
              if p.is_symlink() or p.is_junction():raise ValueError('Uploaded package contains a link')
              if p.is_file():actual.add(p.relative_to(root).as_posix())
          extra=sorted(actual-set(expected))
          result={'artifact_id':11522330720,'build_run_id':37709883960,'build_head':'7bd266a449d90b1823711159dbd33718f9ca223f','expected_files':len(expected),'uploaded_files':len(actual),'missing':missing,'changed':bad,'extra':extra,'hidden_omissions':[n for n in missing if any(t.startswith('.') for t in n.split('/'))],'complete':not(missing or bad or extra),'source_commit':report['source_commit'],'source_tree_sha256':report['source_tree_sha256'],'unpacked_only_delivered':True,'additional_unsigned_msix_build_observed_in_original_log':True,'installation_verified':False}
          (out/'uploaded-integrity.json').write_text(json.dumps(result,indent=2)+'\n')
          (out/'package-size.json').write_text(json.dumps({'total_bytes':sum(v[0] for v in sizes.values()),'groups':[{'path':k,'bytes':v[0],'files':v[1]} for k,v in sorted(sizes.items(),key=lambda r:r[1][0],reverse=True)]},indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k not in ('missing','changed','extra','hidden_omissions')}))
          print('Missing sample:',missing[:20]);print('Changed sample:',bad[:20]);print('Largest groups:',sorted(sizes.items(),key=lambda r:r[1][0],reverse=True)[:10])
          if not result['complete']:raise SystemExit('Uploaded package inventory differs; refusing startup claim')
          stamp=json.loads((root/'resources/install-stamp.json').read_text(encoding='utf-8-sig'))
          assert stamp['commit']==report['source_commit'] and not stamp.get('dirty') and stamp['payload']=='bundled' and stamp['updateMechanism']=='external'
          assert (root/'LuhengOfficeAgent.exe').is_file() and (root/'resources/app.asar').is_file()
          '@
          $script = Join-Path $env:RUNNER_TEMP 'verify-uploaded-candidate.py'
          $code | Set-Content -Encoding utf8 $script
          python -I -S $script (Join-Path $env:RUNNER_TEMP 'luheng-existing-candidate') (Join-Path $env:RUNNER_TEMP 'luheng-smoke-evidence')
          if ($LASTEXITCODE) { throw 'Uploaded byte integrity failed; application was not launched' }
      - name: Exercise a plain native window and contained backend health
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'luheng-existing-candidate/source/apps/desktop/release/win-unpacked'
          $exe = [IO.Path]::GetFullPath((Join-Path $root 'LuhengOfficeAgent.exe'))
          $out = Join-Path $env:RUNNER_TEMP 'luheng-smoke-evidence'
          $state = Join-Path $env:RUNNER_TEMP 'luheng-smoke-private-state'
          New-Item -ItemType Directory -Force $state | Out-Null
          $env:HERMES_HOME = Join-Path $state 'home'
          $env:HERMES_RUNTIME_DIR = Join-Path $state 'parent-tools'
          $env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $state 'electron-user-data'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          foreach ($item in @(Get-ChildItem Env:)) { if ($item.Name -match '(TOKEN|SECRET|PASSWORD|API_KEY|CSC_LINK|AZURE_SIGN|APPLE_ID)') { Remove-Item "Env:$($item.Name)" -ErrorAction SilentlyContinue } }
          $result = [ordered]@{ artifact_id=11522330720; native_windows=$true; architecture=[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString(); plain_launch=$false; contained_backend_health=$false; normal_window_close=$false; forced_cleanup=$false; offline_verified=$false; physical_ime_verified=$false; installation_verified=$false; error=$null }
          try {
            $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru -RedirectStandardOutput (Join-Path $out 'desktop-stdout.log') -RedirectStandardError (Join-Path $out 'desktop-stderr.log')
            $deadline = (Get-Date).AddSeconds(180)
            $window = $null
            do {
              $owned = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\',[StringComparison]::OrdinalIgnoreCase) })
              $windows = @($owned | Where-Object { [IO.Path]::GetFullPath($_.ExecutablePath) -ieq $exe } | ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue } | Where-Object { $_.MainWindowHandle -ne 0 })
              if ($windows.Count -eq 1) { $window=$windows[0];$result.plain_launch=$true;$result.window_title=$window.MainWindowTitle }
              $ids=@($owned.ProcessId)
              foreach ($listener in @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in $ids -and $_.LocalAddress -in @('127.0.0.1','0.0.0.0','::1','::') })) {
                try { $health=Invoke-RestMethod -Uri "http://127.0.0.1:$($listener.LocalPort)/api/health" -TimeoutSec 2; if ($health.ok -eq $true -and $health.version -eq '0.0.0') { $result.contained_backend_health=$true;$result.health_version=$health.version;$result.backend_pid=$listener.OwningProcess;break } } catch {}
              }
              if ($result.plain_launch -and $result.contained_backend_health) { break }
              Start-Sleep -Milliseconds 750
            } while ((Get-Date) -lt $deadline)
            if (-not $result.plain_launch -or -not $result.contained_backend_health) { throw 'Native window or contained backend health did not become ready' }
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap=[System.Drawing.Bitmap]::new($bounds.Width,$bounds.Height)
            $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
            $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
            $bitmap.Save((Join-Path $out 'native-window.png'),[System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose();$bitmap.Dispose()
            Start-Sleep -Seconds 15
            $result.normal_window_close=$window.CloseMainWindow()
            if ($result.normal_window_close) { $result.normal_window_close=$window.WaitForExit(30000) }
          } catch { $result.error=$_.Exception.Message } finally {
            $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\',[StringComparison]::OrdinalIgnoreCase) })
            if ($remaining.Count) { $result.forced_cleanup=$true; $remaining | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }
            $result | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'native-startup.json')
            $result | ConvertTo-Json -Depth 8 | Write-Output
          }
          if ($result.error -or -not $result.plain_launch -or -not $result.contained_backend_health) { throw 'Native startup smoke failed; inspect isolated diagnostics' }
      - name: Preserve only synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luheng-existing-artifact-native-smoke
          path: ${{ runner.temp }}/luheng-smoke-evidence
          retention-days: 7
          compression-level: 6
          if-no-files-found: warn
