name: Luheng Windows installer and native acceptance
permissions:
  contents: read
concurrency:
  group: luheng-windows-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
    - name: Checkout approved source-only controller
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false
        path: controller
    - name: Checkout immutable official source
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: NousResearch/hermes-agent
        ref: 158fd638da1629c8e62caf9ade1515d162def8ab
        persist-credentials: false
        path: source
    - name: Select host Python for official preparation
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Check installer helpers and release scripts before preparing payload
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & controller/qa/native-installer-consumer/Test-LifecycleProcessOwner.ps1 -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE 'helper-preflight')
        python -B controller/qa/release-windows/selftest-package-installer.py
        if ($LASTEXITCODE) { throw 'Installer packaging selftest failed' }
        python -B controller/qa/release-windows/selftest-lifecycle.py
        if ($LASTEXITCODE) { throw 'Installer lifecycle selftest failed' }
        python -B controller/qa/release-windows/selftest-update-feed.py
        if ($LASTEXITCODE) { throw 'Update feed selftest failed' }
        python -B controller/qa/release-windows/selftest-download-site.py
        if ($LASTEXITCODE) { throw 'Download site selftest failed' }
    - name: Reconstruct and admit the exact current source-only candidate
      shell: pwsh
      run: |
        python controller/qa/hermes-native/materialize-v2-source.py controller source
        if ($LASTEXITCODE) { throw 'Exact source admission failed; no build claim is made' }
    - name: Run narrow real Windows Vitest before full payload preparation
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        python -I -S controller/qa/hermes-native/early-native-vitest.py (Join-Path $env:GITHUB_WORKSPACE 'source') (Join-Path $env:RUNNER_TEMP 'early-native-vitest/work') (Join-Path $env:RUNNER_TEMP 'early-native-vitest/cache') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'early-native-vitest.log')
        if ($LASTEXITCODE) { throw 'Early native Windows Vitest failed; full build not started' }
    - name: Prepare locked native Windows inputs
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'X64') { throw 'Native Windows x64 is required' }
        $source = Join-Path $env:GITHUB_WORKSPACE 'source'
        $job = Join-Path $env:RUNNER_TEMP 'luheng-current-unpacked-build'
        New-Item -ItemType Directory -Force $job | Out-Null
        $env:HERMES_HOME = Join-Path $job 'parent-hermes-home'
        $env:HERMES_RUNTIME_DIR = Join-Path $job 'parent-tools'
        $env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $job 'electron-user-data'
        $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
        foreach ($name in @('AZURE_SIGN_ENDPOINT', 'AZURE_CLIENT_ID', 'AZURE_SIGN_PUBLISHER', 'AZURE_TENANT_ID', 'AZURE_CLIENT_SECRET', 'CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'GH_TOKEN', 'GITHUB_TOKEN')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
        Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free | ConvertTo-Json | Set-Content (Join-Path $env:GITHUB_WORKSPACE 'disk-before.json')
        $sha = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'admitted-source-sha.txt')).Trim()
        Set-Location $source
        python -I -S scripts/bundles/desktop.py --repo $source --commit $sha --variant bundled --prepare-only --work (Join-Path $job 'work') --cache (Join-Path $job 'cache') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'prepare.log')
        if ($LASTEXITCODE) { throw 'Official native preparation failed; no artifact is claimed' }
    - name: Run canonical native launcher regression and real packaging Vitest
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        $code = @'
        from pathlib import Path
        import os,sys,subprocess
        source=Path(sys.argv[1]).resolve();prepared_path=Path(sys.argv[2]).resolve();sys.path.insert(0,str(source))
        from scripts.bundles.desktop_prepare import PreparedDesktop
        from scripts.bundles.desktop_inputs import build_environment
        p=PreparedDesktop.load(prepared_path);p.validate();env=build_environment(p,'bundled',os.environ)
        for key in list(env):
            if any(x in key.upper() for x in ('TOKEN','SECRET','PASSWORD','API_KEY','CSC_LINK','AZURE_SIGN','APPLE_ID')):env.pop(key)
        testenv=p.request.work/'launcher-regression-venv'
        assert not testenv.exists()
        os.environ.clear();os.environ.update(env)
        import pm
        built_python=pm.build_environment(source=source,out=testenv,python=p.python,cache=p.request.cache/'python/runtime',env=env,groups=['dev','test'],no_install_project=True,explicit=True)
        assert built_python == testenv/'Scripts/python.exe'
        test_python=testenv/'Scripts/python.exe';assert test_python.is_file();test_env=dict(env);test_env['HERMES_PYTHON']=test_python.as_posix();test_env.pop('__HERMES_ACTIVATED',None)
        bash=Path(os.environ['ProgramFiles'])/'Git/bin/bash.exe';assert bash.is_file()
        subprocess.run([str(bash),'scripts/run_tests.sh','tests/hermes_cli/test_windows_sealed_launcher_exposure.py','-v','--tb=long'],cwd=source,env=test_env,check=True)
        vitest=source/'node_modules/vitest/vitest.mjs';assert vitest.is_file()
        subprocess.run([str(p.node),str(vitest),'run','--project','electron','scripts/prepared-prepackaged.test.mjs','scripts/prepared-packaging.test.mjs','scripts/prepared-native-deps.test.mjs','scripts/run-electron-builder.test.mjs'],cwd=source/'apps/desktop',env=env,check=True)
        subprocess.run([str(p.node),str(source/'node_modules/typescript/bin/tsc'),'--ignoreConfig','--allowJs','--checkJs','--noEmit','--skipLibCheck','--module','nodenext','--moduleResolution','nodenext','--target','es2022','electron-builder.nsis-prepackaged-test.cjs'],cwd=source/'apps/desktop',env=env,check=True)
        print('Native Windows owner regression, real Vitest and NSIS config typecheck passed')
        '@
        $code | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'verify-fixed-source-regressions.py')
        python -I -S (Join-Path $env:RUNNER_TEMP 'verify-fixed-source-regressions.py') (Join-Path $env:GITHUB_WORKSPACE 'source') (Join-Path $env:RUNNER_TEMP 'luheng-current-unpacked-build/work/prepared.json') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'native-regression.log')
        if ($LASTEXITCODE) { throw 'Canonical native regressions failed' }
    - name: Build only from the admitted official prepared inputs
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        Set-Location (Join-Path $env:GITHUB_WORKSPACE 'source')
        python -I -S scripts/bundles/desktop.py --prepared (Join-Path $env:RUNNER_TEMP 'luheng-current-unpacked-build/work/prepared.json') -- --dir 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'unpacked-build.log')
        if ($LASTEXITCODE) { throw 'Official prepared unpacked build failed' }
    - name: Bind the unpacked structure and hashes to the source admission
      shell: pwsh
      run: |
        python controller/qa/hermes-native/verify-contained-candidate.py source (Join-Path $env:RUNNER_TEMP 'luheng-current-unpacked-build/work/prepared.json')
        if ($LASTEXITCODE) { throw 'Unpacked structure check failed; installation and startup remain unverified' }
    - name: Compress pristine package before any launch and verify every extracted file
      shell: pwsh
      run: |-
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence') | Out-Null
        $product = Join-Path $env:GITHUB_WORKSPACE 'portable-product'
        New-Item -ItemType Directory -Force $product | Out-Null
        $archive = Join-Path $product 'Luheng-Windows-x64-verified.7z'
        $source = Join-Path $env:GITHUB_WORKSPACE 'source'
        $zipRoot = Join-Path $source 'apps/desktop/release/win-unpacked'
        $seven = (Get-Command 7z -ErrorAction Stop).Source
        Push-Location $zipRoot
        & $seven a -t7z -mx=9 -m0=lzma2 -ms=on $archive '*'
        if ($LASTEXITCODE) { throw 'Pristine complete compression failed' }
        Pop-Location
        $expanded = Join-Path $env:RUNNER_TEMP 'luheng-verified-portable'
        & $seven x $archive "-o$(Join-Path $expanded 'Luheng-Windows-x64')" -y
        if ($LASTEXITCODE) { throw 'Exact portable extraction failed' }
        $code = @'
        from pathlib import Path
        import hashlib,json,sys
        source=Path(sys.argv[1]);out=Path(sys.argv[2]);root=Path(sys.argv[3])/'Luheng-Windows-x64';archive=Path(sys.argv[4]);report=json.loads((source.parent/'windows-unpacked-structure.json').read_text(encoding='utf-8-sig'));expected={r['path']:r for r in report['files']};actual=set()
        assert len(expected)==len(report['files'])
        for p in root.rglob('*'):
            assert not p.is_symlink() and not p.is_junction()
            if p.is_file():actual.add(p.relative_to(root).as_posix())
        assert actual==set(expected)
        for name,row in expected.items():
            p=root/name;assert p.stat().st_size==row['bytes']
            with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']
        with archive.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()
        result={'archive':archive.name,'bytes':archive.stat().st_size,'sha256':digest,'files':len(expected),'all_hidden_files_included':True,'seven_zip_roundtrip_every_file_sha256_verified':True,'source_commit':report['source_commit'],'source_tree_sha256':report['source_tree_sha256'],'under_2_GiB':archive.stat().st_size<2*1024**3,'unsigned':True,'installation_verified':False,'automatic_update_verified':False,'compression_before_any_launch':True}
        (out/'verified-portable-archive.json').write_text(json.dumps(result,indent=2)+'\n');(archive.parent/'SHA256SUMS').write_text(digest+'  '+archive.name+'\n');print(json.dumps(result))
        assert result['under_2_GiB']
        '@
        $code | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'verify-pristine-7z.py')
        python -I -S (Join-Path $env:RUNNER_TEMP 'verify-pristine-7z.py') $source (Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence') $expanded $archive
        if ($LASTEXITCODE) { throw 'Exact portable roundtrip failed' }
      id: portable
    - name: Preserve pristine portable before functional acceptance
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-windows-portable-unreleased
        path: ${{ github.workspace }}/portable-product/**
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
      if: ${{ always() && steps.portable.outcome == 'success' }}
    - name: Exercise shipped CLI terminal files and disabled scheduler without package writes
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $stateParent = Join-Path $env:RUNNER_TEMP 'luheng-tool-contract-private'
        New-Item -ItemType Directory -Force $stateParent | Out-Null
        $package = Join-Path $env:RUNNER_TEMP 'luheng-verified-portable/Luheng-Windows-x64'
        & (Join-Path $env:GITHUB_WORKSPACE 'controller/qa/windows-tool-contracts/Invoke-WindowsToolContracts.ps1') -PackageRoot $package -RuntimeManifest (Join-Path $package 'resources/agent-payload/manifest.json') -StateParent $stateParent
        if ($LASTEXITCODE) { throw 'Native Windows tool contracts failed' }
      id: contracts
      continue-on-error: true
    - name: Exercise a plain native window and contained backend health
      if: success()
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = Join-Path $env:RUNNER_TEMP 'luheng-verified-portable/Luheng-Windows-x64'
        $exe = [IO.Path]::GetFullPath((Join-Path $root 'LuhengOfficeAgent.exe'))
        $out = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence'
        $state = Join-Path $env:RUNNER_TEMP 'luheng-smoke-private-state'
        New-Item -ItemType Directory -Force $state | Out-Null
        $env:HERMES_HOME = Join-Path $state 'home'
        $env:HERMES_RUNTIME_DIR = Join-Path $state 'parent-tools'
        $env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $state 'electron-user-data'
        $env:ELECTRON_ENABLE_LOGGING = '1'
        foreach ($item in @(Get-ChildItem Env:)) { if ($item.Name -match '(TOKEN|SECRET|PASSWORD|API_KEY|CSC_LINK|AZURE_SIGN|APPLE_ID)') { Remove-Item "Env:$($item.Name)" -ErrorAction SilentlyContinue } }
        $expectedVersion = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'windows-unpacked-structure.json') -Raw | ConvertFrom-Json).base_version
        $result = [ordered]@{ build_run_id=$env:GITHUB_RUN_ID; native_windows=$true; architecture=[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString(); plain_launch=$false; contained_backend_health=$false; normal_window_close=$false; forced_cleanup=$false; offline_verified=$false; physical_ime_verified=$false; installation_verified=$false; error=$null }
        try {
          $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru -RedirectStandardOutput (Join-Path $out 'desktop-stdout.log') -RedirectStandardError (Join-Path $out 'desktop-stderr.log')
          $deadline = (Get-Date).AddSeconds(180)
          $window = $null
          do {
            $owned = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\',[StringComparison]::OrdinalIgnoreCase) })
            $windows = @($owned | Where-Object { [IO.Path]::GetFullPath($_.ExecutablePath) -ieq $exe } | ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue } | Where-Object { $_.MainWindowHandle -ne 0 })
            if ($windows.Count -eq 1) { $window=$windows[0];$result.plain_launch=$true;$result.window_title=$window.MainWindowTitle }
            $ids=@($owned.ProcessId)
            foreach ($listener in @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in $ids -and $_.LocalAddress -in @('127.0.0.1','0.0.0.0','::1','::') })) {
              try { $health=Invoke-RestMethod -Uri "http://127.0.0.1:$($listener.LocalPort)/api/health" -TimeoutSec 2; if ($health.ok -eq $true -and $health.version -eq $expectedVersion) { $result.contained_backend_health=$true;$result.health_version=$health.version;$result.backend_pid=$listener.OwningProcess;break } } catch {}
            }
            if ($result.plain_launch -and $result.contained_backend_health) { break }
            Start-Sleep -Milliseconds 750
          } while ((Get-Date) -lt $deadline)
          if (-not $result.plain_launch -or -not $result.contained_backend_health) { throw 'Native window or contained backend health did not become ready' }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap=[System.Drawing.Bitmap]::new($bounds.Width,$bounds.Height)
          $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)
          $bitmap.Save((Join-Path $out 'native-window.png'),[System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose();$bitmap.Dispose()
          Start-Sleep -Seconds 15
          $result.normal_window_close=$window.CloseMainWindow()
          if ($result.normal_window_close) { $result.normal_window_close=$window.WaitForExit(30000) }
        } catch { $result.error=$_.Exception.Message } finally {
          $shutdownDeadline = (Get-Date).AddSeconds(30)
          do {
            $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\',[StringComparison]::OrdinalIgnoreCase) })
            if (-not $remaining.Count) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $shutdownDeadline)
          $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\',[StringComparison]::OrdinalIgnoreCase) })
          if ($remaining.Count) { $result.forced_cleanup=$true; $remaining | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }
          $result | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'native-startup.json')
          $result | ConvertTo-Json -Depth 8 | Write-Output
        }
        if ($result.error -or -not $result.plain_launch -or -not $result.contained_backend_health -or -not $result.normal_window_close -or $result.forced_cleanup) { throw 'Native startup smoke failed; inspect isolated diagnostics' }
      id: native_smoke
    - name: Package the unchanged admitted payload as a Windows installer
      id: installer
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        python -I -S -B controller/qa/release-windows/package-installer.py --source source --prepared (Join-Path $env:RUNNER_TEMP 'luheng-current-unpacked-build/work/prepared.json') --structure windows-unpacked-structure.json --health native-smoke-evidence/native-startup.json --archive portable-product/Luheng-Windows-x64-verified.7z --run-id $env:GITHUB_RUN_ID --output installer-product 2>&1 | Tee-Object installer-package.log
        if ($LASTEXITCODE) { throw 'NSIS installer packaging failed' }
    - name: Preserve installer bytes before installation acceptance
      if: ${{ always() && steps.installer.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-windows-installer-unreleased
        path: ${{ github.workspace }}/installer-product/**
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
    - name: Install launch and uninstall using a restricted Windows token
      id: lifecycle
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        python -I -S -B controller/qa/release-windows/prepare-lifecycle-contract.py --evidence $env:GITHUB_WORKSPACE --build-receipt installer-product/installer-build.json --output lifecycle-contract.json
        if ($LASTEXITCODE) { throw 'Same-run lifecycle contract failed' }
        $job = Join-Path $env:RUNNER_TEMP 'luheng-installer-acceptance'
        New-Item -ItemType Directory -Force (Join-Path $job 'evidence') | Out-Null
        $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
        & icacls $job /grant "*${sid}:(OI)(CI)F" /T
        if ($LASTEXITCODE) { throw 'Restricted acceptance directory permissions failed' }
        $consumer = Join-Path $env:GITHUB_WORKSPACE 'controller/qa/native-installer-consumer'
        $release = Join-Path $env:GITHUB_WORKSPACE 'controller/qa/release-windows'
        $arguments = '-Contract "' + (Join-Path $env:GITHUB_WORKSPACE 'lifecycle-contract.json') + '" -BuildReceipt "' + (Join-Path $env:GITHUB_WORKSPACE 'installer-product/installer-build.json') + '" -OriginalEvidence "' + $env:GITHUB_WORKSPACE + '" -JobRoot "' + $job + '" -Verifier "' + (Join-Path $release 'verify-installed-tree.py') + '" -PythonExecutable "' + (Get-Command python).Source + '"'
        & (Join-Path $consumer 'token-review/Run-RestrictedLifecycle.ps1') -ProbeScript (Join-Path $consumer 'Invoke-InstallerLifecycle.ps1') -PowerShellExecutable (Get-Command pwsh).Source -ProbeArgumentLine $arguments -WorkingDirectory $job -EvidencePath (Join-Path $job 'evidence/restricted-token.json') -TimeoutSeconds 1200 -ExtraEnvironment @{ RUNNER_TEMP=$env:RUNNER_TEMP; GITHUB_ACTIONS='true'; GITHUB_RUN_ID=$env:GITHUB_RUN_ID; GITHUB_SHA=$env:GITHUB_SHA; GITHUB_RUN_ATTEMPT=$env:GITHUB_RUN_ATTEMPT } -ExecuteProbe
    - name: Preserve source build regression tool and native startup diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-windows-release-evidence
        path: |
          ${{ github.workspace }}/source-admission.json
          ${{ github.workspace }}/windows-unpacked-structure.json
          ${{ github.workspace }}/native-smoke-evidence/**
          ${{ github.workspace }}/*.log
          ${{ runner.temp }}/luheng-tool-contract-private/*/summary.json
          ${{ runner.temp }}/luheng-tool-contract-private/*/results/**

          ${{ runner.temp }}/luheng-installer-acceptance/evidence/**
          ${{ runner.temp }}/luheng-installer-acceptance/contract-admission.json
          ${{ github.workspace }}/lifecycle-contract.json
          ${{ github.workspace }}/installer-product/installer-build.json
          ${{ github.workspace }}/helper-preflight/**
        include-hidden-files: true
        compression-level: 6
        retention-days: 14
        if-no-files-found: warn
    - name: Require all native acceptance stages before release
      if: ${{ always() }}
      shell: pwsh
      env:
        CONTRACT_RESULT: ${{ steps.contracts.outcome }}
        NATIVE_RESULT: ${{ steps.native_smoke.outcome }}
        INSTALLER_RESULT: ${{ steps.installer.outcome }}
        LIFECYCLE_RESULT: ${{ steps.lifecycle.outcome }}
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($name in @('CONTRACT_RESULT','NATIVE_RESULT','INSTALLER_RESULT','LIFECYCLE_RESULT')) {
          if ([Environment]::GetEnvironmentVariable($name) -ne 'success') { throw "Release acceptance failed: $name" }
        }
        Write-Output 'Windows installer, runtime contracts, native launch and restricted-token lifecycle passed. Artifacts remain unpublished pending release.'
'on':
  push:
    branches:
    - codex/windows-release-completion
    paths:
    - .github/workflows/hermes-native-package-experiment.yml
    - qa/**
    - '!qa/release-windows/update-pairs/**'
    - '!qa/release-windows/verify-online-update*'
  workflow_dispatch: null
