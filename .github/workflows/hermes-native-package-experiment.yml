name: Luheng fixed Windows source native regressions and pristine package qualification
permissions:
  contents: read
concurrency:
  group: luheng-pinned-unpacked-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
    - name: Checkout approved source-only controller
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        persist-credentials: false
        path: controller
    - name: Checkout immutable official source
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        repository: NousResearch/hermes-agent
        ref: 158fd638da1629c8e62caf9ade1515d162def8ab
        persist-credentials: false
        path: source
    - name: Select host Python for official preparation
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Reconstruct and admit the exact current source-only candidate
      shell: pwsh
      run: 'python controller/qa/hermes-native/materialize-v2-source.py controller source

        if ($LASTEXITCODE) { throw ''Exact source admission failed; no build claim is made'' }

        '
    - name: Run narrow real Windows Vitest before full payload preparation
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        python -I -S controller/qa/hermes-native/early-native-vitest.py (Join-Path $env:GITHUB_WORKSPACE ''source'') (Join-Path $env:RUNNER_TEMP ''early-native-vitest/work'') (Join-Path $env:RUNNER_TEMP ''early-native-vitest/cache'') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE ''early-native-vitest.log'')

        if ($LASTEXITCODE) { throw ''Early native Windows Vitest failed; full build not started'' }'
    - name: Prepare locked native Windows inputs
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne ''X64'') { throw ''Native Windows x64 is required'' }

        $source = Join-Path $env:GITHUB_WORKSPACE ''source''

        $job = Join-Path $env:RUNNER_TEMP ''luheng-current-unpacked-build''

        New-Item -ItemType Directory -Force $job | Out-Null

        $env:HERMES_HOME = Join-Path $job ''parent-hermes-home''

        $env:HERMES_RUNTIME_DIR = Join-Path $job ''parent-tools''

        $env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $job ''electron-user-data''

        $env:CSC_IDENTITY_AUTO_DISCOVERY = ''false''

        foreach ($name in @(''AZURE_SIGN_ENDPOINT'', ''AZURE_CLIENT_ID'', ''AZURE_SIGN_PUBLISHER'', ''AZURE_TENANT_ID'', ''AZURE_CLIENT_SECRET'', ''CSC_LINK'', ''CSC_KEY_PASSWORD'', ''APPLE_ID'', ''APPLE_APP_SPECIFIC_PASSWORD'', ''GH_TOKEN'', ''GITHUB_TOKEN'')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }

        Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free | ConvertTo-Json | Set-Content (Join-Path $env:GITHUB_WORKSPACE ''disk-before.json'')

        $sha = (Get-Content (Join-Path $env:GITHUB_WORKSPACE ''admitted-source-sha.txt'')).Trim()

        Set-Location $source

        python -I -S scripts/bundles/desktop.py --repo $source --commit $sha --variant bundled --prepare-only --work (Join-Path $job ''work'') --cache (Join-Path $job ''cache'') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE ''prepare.log'')

        if ($LASTEXITCODE) { throw ''Official native preparation failed; no artifact is claimed'' }

        '
    - name: Run canonical native launcher regression and real packaging Vitest
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$code = @'\nfrom pathlib import Path\nimport os,sys,subprocess\nsource=Path(sys.argv[1]).resolve();prepared_path=Path(sys.argv[2]).resolve();sys.path.insert(0,str(source))\nfrom scripts.bundles.desktop_prepare import PreparedDesktop\nfrom scripts.bundles.desktop_inputs import build_environment\np=PreparedDesktop.load(prepared_path);p.validate();env=build_environment(p,'bundled',os.environ)\nfor key in list(env):\n    if any(x in key.upper() for x in ('TOKEN','SECRET','PASSWORD','API_KEY','CSC_LINK','AZURE_SIGN','APPLE_ID')):env.pop(key)\ntestenv=p.request.work/'launcher-regression-venv'\nassert not testenv.exists()\nos.environ.clear();os.environ.update(env)\nimport pm\nbuilt_python=pm.build_environment(source=source,out=testenv,python=p.python,cache=p.request.cache/'python/runtime',env=env,groups=['dev','test'],no_install_project=True,explicit=True)\nassert built_python == testenv/'Scripts/python.exe'\ntest_python=testenv/'Scripts/python.exe';assert test_python.is_file();test_env=dict(env);test_env['HERMES_PYTHON']=test_python.as_posix();test_env.pop('__HERMES_ACTIVATED',None)\nbash=Path(os.environ['ProgramFiles'])/'Git/bin/bash.exe';assert bash.is_file()\nsubprocess.run([str(bash),'scripts/run_tests.sh','tests/hermes_cli/test_windows_sealed_launcher_exposure.py','-v','--tb=long'],cwd=source,env=test_env,check=True)\nvitest=source/'node_modules/vitest/vitest.mjs';assert vitest.is_file()\nsubprocess.run([str(p.node),str(vitest),'run','--project','electron','scripts/prepared-prepackaged.test.mjs','scripts/prepared-packaging.test.mjs','scripts/prepared-native-deps.test.mjs','scripts/run-electron-builder.test.mjs'],cwd=source/'apps/desktop',env=env,check=True)\nsubprocess.run([str(p.node),str(source/'node_modules/typescript/bin/tsc'),'--ignoreConfig','--allowJs','--checkJs','--noEmit','--skipLibCheck','--module','nodenext','--moduleResolution','nodenext','--target','es2022','electron-builder.nsis-prepackaged-test.cjs'],cwd=source/'apps/desktop',env=env,check=True)\nprint('Native Windows owner regression, real Vitest and NSIS config typecheck passed')\n'@\n$code | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'verify-fixed-source-regressions.py')\npython -I -S (Join-Path $env:RUNNER_TEMP 'verify-fixed-source-regressions.py') (Join-Path $env:GITHUB_WORKSPACE 'source') (Join-Path $env:RUNNER_TEMP 'luheng-current-unpacked-build/work/prepared.json') 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE 'native-regression.log')\nif ($LASTEXITCODE) { throw 'Canonical native regressions failed' }"
    - name: Build only from the admitted official prepared inputs
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        Set-Location (Join-Path $env:GITHUB_WORKSPACE ''source'')

        python -I -S scripts/bundles/desktop.py --prepared (Join-Path $env:RUNNER_TEMP ''luheng-current-unpacked-build/work/prepared.json'') -- --dir 2>&1 | Tee-Object (Join-Path $env:GITHUB_WORKSPACE ''unpacked-build.log'')

        if ($LASTEXITCODE) { throw ''Official prepared unpacked build failed'' }'
    - name: Bind the unpacked structure and hashes to the source admission
      shell: pwsh
      run: 'python controller/qa/hermes-native/verify-contained-candidate.py source (Join-Path $env:RUNNER_TEMP ''luheng-current-unpacked-build/work/prepared.json'')

        if ($LASTEXITCODE) { throw ''Unpacked structure check failed; installation and startup remain unverified'' }

        '
    - name: Compress pristine package before any launch and verify every extracted file
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$out = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence'\nNew-Item -ItemType Directory -Force $out | Out-Null\n$product = Join-Path $env:GITHUB_WORKSPACE 'portable-product'\nNew-Item -ItemType Directory -Force $product | Out-Null\n$archive = Join-Path $product 'Luheng-Windows-x64-verified.7z'\n$source = Join-Path $env:GITHUB_WORKSPACE 'source'\n$zipRoot = Join-Path $source 'apps/desktop/release'\n$original = Join-Path $zipRoot 'win-unpacked'\n$named = Join-Path $zipRoot 'Luheng-Windows-x64'\nif (-not (Test-Path -LiteralPath $original -PathType Container) -or (Test-Path -LiteralPath $named)) { throw 'Unexpected pristine build output layout' }\nMove-Item -LiteralPath $original -Destination $named\n$seven = (Get-Command 7z -ErrorAction Stop).Source\nPush-Location $zipRoot\n& $seven a -t7z -mx=5 -m0=lzma2 -ms=on $archive 'Luheng-Windows-x64'\nif ($LASTEXITCODE) { throw 'Pristine complete compression failed' }\nPop-Location\n$expanded = Join-Path $env:RUNNER_TEMP 'luheng-verified-portable'\n& $seven x $archive \"-o$expanded\" -y\nif ($LASTEXITCODE) { throw 'Exact portable extraction failed' }\n$code = @'\nfrom pathlib import Path\nimport hashlib,json,sys\nsource=Path(sys.argv[1]);out=Path(sys.argv[2]);root=Path(sys.argv[3])/'Luheng-Windows-x64';archive=Path(sys.argv[4]);report=json.loads((source.parent/'windows-unpacked-structure.json').read_text(encoding='utf-8-sig'));expected={r['path']:r for r in report['files']};actual=set()\nassert len(expected)==len(report['files'])\nfor p in root.rglob('*'):\n    assert not p.is_symlink() and not p.is_junction()\n    if p.is_file():actual.add(p.relative_to(root).as_posix())\nassert actual==set(expected)\nfor name,row in expected.items():\n    p=root/name;assert p.stat().st_size==row['bytes']\n    with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']\nwith archive.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()\nresult={'archive':archive.name,'bytes':archive.stat().st_size,'sha256':digest,'files':len(expected),'all_hidden_files_included':True,'seven_zip_roundtrip_every_file_sha256_verified':True,'source_commit':report['source_commit'],'source_tree_sha256':report['source_tree_sha256'],'under_2_GiB':archive.stat().st_size<2*1024**3,'unsigned':True,'installation_verified':False,'automatic_update_verified':False,'compression_before_any_launch':True}\n(out/'verified-portable-archive.json').write_text(json.dumps(result,indent=2)+'\\n');(archive.parent/'SHA256SUMS').write_text(digest+'  '+archive.name+'\\n');print(json.dumps(result))\nassert result['under_2_GiB']\n'@\n$code | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'verify-pristine-7z.py')\npython -I -S (Join-Path $env:RUNNER_TEMP 'verify-pristine-7z.py') $source (Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence') $expanded $archive\nif ($LASTEXITCODE) { throw 'Exact portable roundtrip failed' }"
      id: pristine_archive
    - name: Retain byte-verified candidate before functional tests; not a delivery claim
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-byte-verified-candidate-portable
        path: ${{ github.workspace }}/portable-product/**
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
    - name: Exercise shipped CLI terminal files and disabled scheduler without package writes
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $harness = Join-Path $env:RUNNER_TEMP ''luheng-reviewed-contract-harness''

        New-Item -ItemType Directory -Force $harness | Out-Null

        [IO.File]::WriteAllBytes((Join-Path $harness ''Invoke-WindowsToolContracts.ps1''),[Convert]::FromBase64String(''''))

        [IO.File]::WriteAllBytes((Join-Path $harness ''windows_tool_contracts.py''),[Convert]::FromBase64String(''''))

        [IO.File]::WriteAllBytes((Join-Path $harness ''wtc_guard.py''),[Convert]::FromBase64String(''''))

        $stateParent = Join-Path $env:RUNNER_TEMP ''luheng-tool-contract-private''

        New-Item -ItemType Directory -Force $stateParent | Out-Null

        $package = Join-Path $env:RUNNER_TEMP ''luheng-verified-portable/Luheng-Windows-x64''

        & (Join-Path $harness ''Invoke-WindowsToolContracts.ps1'') -PackageRoot $package -RuntimeManifest (Join-Path $package ''resources/agent-payload/manifest.json'') -StateParent $stateParent

        if ($LASTEXITCODE) { throw ''Native Windows tool contracts failed'' }'
    - name: Exercise a plain native window and contained backend health
      if: ${{ !cancelled() && steps.pristine_archive.outcome == 'success' }}
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$root = Join-Path $env:RUNNER_TEMP 'luheng-verified-portable/Luheng-Windows-x64'\n$exe = [IO.Path]::GetFullPath((Join-Path $root 'LuhengOfficeAgent.exe'))\n$out = Join-Path $env:GITHUB_WORKSPACE 'native-smoke-evidence'\n$state = Join-Path $env:RUNNER_TEMP 'luheng-smoke-private-state'\nNew-Item -ItemType Directory -Force $state | Out-Null\n$env:HERMES_HOME = Join-Path $state 'home'\n$env:HERMES_RUNTIME_DIR = Join-Path $state 'parent-tools'\n$env:HERMES_DESKTOP_USER_DATA_DIR = Join-Path $state 'electron-user-data'\n$env:ELECTRON_ENABLE_LOGGING = '1'\nforeach ($item in @(Get-ChildItem Env:)) { if ($item.Name -match '(TOKEN|SECRET|PASSWORD|API_KEY|CSC_LINK|AZURE_SIGN|APPLE_ID)') { Remove-Item \"Env:$($item.Name)\" -ErrorAction SilentlyContinue } }\n$result = [ordered]@{ build_run_id=$env:GITHUB_RUN_ID; native_windows=$true; architecture=[System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString(); plain_launch=$false; contained_backend_health=$false; normal_window_close=$false; forced_cleanup=$false; offline_verified=$false; physical_ime_verified=$false; installation_verified=$false; error=$null }\ntry {\n  $p = Start-Process -FilePath $exe -WorkingDirectory $root -PassThru -RedirectStandardOutput (Join-Path $out 'desktop-stdout.log') -RedirectStandardError (Join-Path $out 'desktop-stderr.log')\n  $deadline = (Get-Date).AddSeconds(180)\n  $window = $null\n  do {\n    $owned = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\\',[StringComparison]::OrdinalIgnoreCase) })\n    $windows = @($owned | Where-Object { [IO.Path]::GetFullPath($_.ExecutablePath) -ieq $exe } | ForEach-Object { Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue } | Where-Object { $_.MainWindowHandle -ne 0 })\n    if ($windows.Count -eq 1) { $window=$windows[0];$result.plain_launch=$true;$result.window_title=$window.MainWindowTitle }\n    $ids=@($owned.ProcessId)\n    foreach ($listener in @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.OwningProcess -in $ids -and $_.LocalAddress -in @('127.0.0.1','0.0.0.0','::1','::') })) {\n      try { $health=Invoke-RestMethod -Uri \"http://127.0.0.1:$($listener.LocalPort)/api/health\" -TimeoutSec 2; if ($health.ok -eq $true -and $health.version -eq '0.0.0') { $result.contained_backend_health=$true;$result.health_version=$health.version;$result.backend_pid=$listener.OwningProcess;break } } catch {}\n    }\n    if ($result.plain_launch -and $result.contained_backend_health) { break }\n    Start-Sleep -Milliseconds 750\n  } while ((Get-Date) -lt $deadline)\n  if (-not $result.plain_launch -or -not $result.contained_backend_health) { throw 'Native window or contained backend health did not become ready' }\n  Add-Type -AssemblyName System.Windows.Forms\n  Add-Type -AssemblyName System.Drawing\n  $bounds=[System.Windows.Forms.Screen]::PrimaryScreen.Bounds\n  $bitmap=[System.Drawing.Bitmap]::new($bounds.Width,$bounds.Height)\n  $graphics=[System.Drawing.Graphics]::FromImage($bitmap)\n  $graphics.CopyFromScreen($bounds.Location,[System.Drawing.Point]::Empty,$bounds.Size)\n  $bitmap.Save((Join-Path $out 'native-window.png'),[System.Drawing.Imaging.ImageFormat]::Png)\n  $graphics.Dispose();$bitmap.Dispose()\n  Start-Sleep -Seconds 15\n  $result.normal_window_close=$window.CloseMainWindow()\n  if ($result.normal_window_close) { $result.normal_window_close=$window.WaitForExit(30000) }\n} catch { $result.error=$_.Exception.Message } finally {\n  $remaining = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath).StartsWith([IO.Path]::GetFullPath($root)+'\\',[StringComparison]::OrdinalIgnoreCase) })\n  if ($remaining.Count) { $result.forced_cleanup=$true; $remaining | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }\n  $result | ConvertTo-Json -Depth 8 | Set-Content (Join-Path $out 'native-startup.json')\n  $result | ConvertTo-Json -Depth 8 | Write-Output\n}\nif ($result.error -or -not $result.plain_launch -or -not $result.contained_backend_health -or -not $result.normal_window_close -or $result.forced_cleanup) { throw 'Native startup smoke failed; inspect isolated diagnostics' }\n"
    - name: Preserve source build regression tool and native startup diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-fixed-windows-native-evidence
        path: '${{ github.workspace }}/source-admission.json

          ${{ github.workspace }}/windows-unpacked-structure.json

          ${{ github.workspace }}/native-smoke-evidence/**

          ${{ github.workspace }}/*.log

          ${{ runner.temp }}/luheng-tool-contract-private/*/summary.json

          ${{ runner.temp }}/luheng-tool-contract-private/*/results/**

          ${{ runner.temp }}/early-native-vitest/work/guard-selftests/*/summary.json

          ${{ runner.temp }}/early-native-vitest/work/guard-selftests/*/results/**

          '
        include-hidden-files: true
        compression-level: 6
        retention-days: 14
        if-no-files-found: warn
    - name: Preserve qualified pristine full Windows portable
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-fixed-qualified-windows-portable
        path: ${{ github.workspace }}/portable-product/**
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
'on':
  push:
    branches:
    - probe/hermes-native-package-current-20261006
    paths:
    - .github/workflows/hermes-native-package-experiment.yml
    - qa/hermes-native/**
  workflow_dispatch: null
