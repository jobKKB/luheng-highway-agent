name: Luheng pristine portable roundtrip and real Windows tool contracts
permissions:
  contents: read
  actions: read
concurrency:
  group: luheng-existing-artifact-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-artifact-smoke:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - name: Check exact build artifact identity and available disk
      shell: pwsh
      env:
        READ_TOKEN: ${{ github.token }}
      run: '$ErrorActionPreference = ''Stop''

        $out = Join-Path $env:RUNNER_TEMP ''luheng-portable-evidence''

        New-Item -ItemType Directory -Force $out | Out-Null

        $a = Invoke-RestMethod -Uri ''https://api.github.com/repos/jobKKB/luheng-highway-agent/actions/artifacts/11525378322'' -Headers @{ Authorization = "Bearer $env:READ_TOKEN"; Accept = ''application/vnd.github+json'' }

        if ($a.expired -or $a.size_in_bytes -ne 4026124864 -or $a.digest -ne ''sha256:306ba5b58420fc8ad494cca1aefc853018cd68837a099a5229324ba79364f76c'' -or $a.workflow_run.id -ne 37715337242 -or $a.workflow_run.head_sha -ne ''56a57ae09e9a55afdc120d335b329f2dac67d710'') { throw ''Exact artifact identity differs'' }

        $a | ConvertTo-Json -Depth 10 | Set-Content (Join-Path $out ''artifact-identity.json'')

        Get-PSDrive -PSProvider FileSystem | Select-Object Name,Free | ConvertTo-Json | Set-Content (Join-Path $out ''disk-before.json'')

        $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:RUNNER_TEMP).TrimEnd(''\'').TrimEnd('':''))

        if ($drive.Free -lt 35GB) { throw ''Less than 35 GiB of scratch space; refusing duplicate expansion'' }

        '
    - name: Consume the existing build without rebuilding
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: '11525378322'
        run-id: '37715337242'
        repository: jobKKB/luheng-highway-agent
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/luheng-built-archives
        merge-multiple: true
    - name: Select an independent verifier interpreter
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Verify and extract the pristine standard ZIP before any runtime launch
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$code = @'\nfrom pathlib import Path,PurePosixPath\nimport hashlib,json,zipfile,sys,shutil\nbase=Path(sys.argv[1]);out=Path(sys.argv[2]);dest=Path(sys.argv[3]);archive=base/'Luheng-Windows-x64-complete.zip'\nassert archive.stat().st_size==2515062340\nwith archive.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()=='d043f9c3e8ee8728a53f84b39698a1bdef0a23e3109e3aa9675dc7572beec1f2'\nmanifest=base/'windows-unpacked-structure.json';report=json.loads(manifest.read_text(encoding='utf-8-sig'));expected={r['path']:r for r in report['files']}\nassert len(expected)==len(report['files'])==117873\nassert report['source_commit']=='135c186bfc034d6fb48a096f2e5ca0b056c86ffb' and report['source_tree_sha256']=='e8728b0ff4c3a1433daedb8d7bc3db9c01bb8d93f3775f3049461b899d363d03' and not report['production_update_enabled']\nwith zipfile.ZipFile(archive) as z:\n    names=z.namelist();assert len(names)==len(set(names))==len(expected)\n    assert set(names)=={'Luheng-Windows-x64/'+n for n in expected}\n    for name,row in expected.items():\n        parts=PurePosixPath(name).parts;assert name and not PurePosixPath(name).is_absolute() and all(p not in ('','.','..') for p in parts) and '\\\\' not in name and ':' not in name\n        with z.open('Luheng-Windows-x64/'+name) as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']\n    z.extractall(dest)\nroot=dest/'Luheng-Windows-x64';actual={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()};assert actual==set(expected)\nfor name,row in expected.items():\n    p=root/name;assert p.is_file() and not p.is_symlink() and not p.is_junction() and p.stat().st_size==row['bytes']\n    with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']\nprior=json.loads((base/'native-smoke-evidence/native-startup.json').read_text(encoding='utf-8-sig'))\nassert prior['plain_launch'] and prior['contained_backend_health'] and prior['normal_window_close'] and not prior['forced_cleanup'] and prior['error'] is None\nfor name in ('native-startup.json','native-window.png','compressed-roundtrip.json','package-size.json'):\n    shutil.copyfile(base/'native-smoke-evidence'/name,out/name)\nshutil.copyfile(manifest,out/'windows-unpacked-structure.json');shutil.copyfile(base/'source-admission.json',out/'source-admission.json')\nresult={'build_artifact_id':11525378322,'build_run_id':37715337242,'source_commit':report['source_commit'],'source_tree_sha256':report['source_tree_sha256'],'files':len(expected),'pristine_zip_sha256':'d043f9c3e8ee8728a53f84b39698a1bdef0a23e3109e3aa9675dc7572beec1f2','native_manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),'prior_native_startup_sha256':hashlib.sha256((base/'native-smoke-evidence/native-startup.json').read_bytes()).hexdigest(),'every_pristine_file_sha256_verified':True,'known_post_startup_7z_not_consumed':True}\n(out/'pristine-admission.json').write_text(json.dumps(result,indent=2)+'\\n');print(json.dumps(result))\n'@\n$code | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'verify-pristine-zip.py')\npython -I -S (Join-Path $env:RUNNER_TEMP 'verify-pristine-zip.py') (Join-Path $env:RUNNER_TEMP 'luheng-built-archives') (Join-Path $env:RUNNER_TEMP 'luheng-portable-evidence') (Join-Path $env:RUNNER_TEMP 'luheng-pristine-package')\nif ($LASTEXITCODE) { throw 'Pristine archive admission failed' }"
    - name: Compress only pristine bytes and verify full 7z extraction hashes
      shell: pwsh
      run: "$ErrorActionPreference = 'Stop'\n$out = Join-Path $env:RUNNER_TEMP 'luheng-portable-evidence'\n$product = Join-Path $env:RUNNER_TEMP 'luheng-portable-product'\nNew-Item -ItemType Directory -Force $product | Out-Null\n$archive = Join-Path $product 'Luheng-Windows-x64-verified.7z'\n$seven = Get-Command 7z -ErrorAction Stop\nPush-Location (Join-Path $env:RUNNER_TEMP 'luheng-pristine-package')\n& $seven.Source a -t7z -mx=9 -m0=lzma2 -ms=on $archive 'Luheng-Windows-x64'\nif ($LASTEXITCODE) { throw 'Pristine lossless compression failed' }\nPop-Location\n$expanded = Join-Path $env:RUNNER_TEMP 'luheng-verified-portable'\n& $seven.Source x $archive \"-o$expanded\" -y\nif ($LASTEXITCODE) { throw '7z extraction failed' }\n$code = @'\nfrom pathlib import Path\nimport hashlib,json,sys\nbase=Path(sys.argv[1]);out=Path(sys.argv[2]);root=Path(sys.argv[3])/'Luheng-Windows-x64';archive=Path(sys.argv[4]);report=json.loads((base/'windows-unpacked-structure.json').read_text(encoding='utf-8-sig'));expected={r['path']:r for r in report['files']}\nactual=set()\nfor p in root.rglob('*'):\n    assert not p.is_symlink() and not p.is_junction()\n    if p.is_file():actual.add(p.relative_to(root).as_posix())\nassert actual==set(expected) and len(actual)==117873\nfor name,row in expected.items():\n    p=root/name;assert p.stat().st_size==row['bytes']\n    with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==row['sha256']\nwith archive.open('rb') as f:digest=hashlib.file_digest(f,'sha256').hexdigest()\nresult={'archive':archive.name,'bytes':archive.stat().st_size,'sha256':digest,'files':len(expected),'all_hidden_files_included':True,'seven_zip_roundtrip_every_file_sha256_verified':True,'source_commit':report['source_commit'],'source_tree_sha256':report['source_tree_sha256'],'under_2_GiB':archive.stat().st_size<2*1024**3,'unsigned':True,'installation_verified':False,'automatic_update_verified':False}\n(out/'verified-portable-archive.json').write_text(json.dumps(result,indent=2)+'\\n');(archive.parent/'SHA256SUMS').write_text(digest+'  '+archive.name+'\\n');print(json.dumps(result))\nif not result['under_2_GiB']:raise SystemExit('Portable archive still exceeds single asset size')\n'@\n$code | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'verify-pristine-7z.py')\npython -I -S (Join-Path $env:RUNNER_TEMP 'verify-pristine-7z.py') (Join-Path $env:RUNNER_TEMP 'luheng-built-archives') $out $expanded $archive\nif ($LASTEXITCODE) { throw 'Byte-exact 7z round-trip admission failed' }"
    - name: Exercise shipped CLI real commands files and disabled scheduler lifecycle
      shell: pwsh
      run: '$ErrorActionPreference = ''Stop''

        $harness = Join-Path $env:RUNNER_TEMP ''luheng-reviewed-contract-harness''

        New-Item -ItemType Directory -Force $harness | Out-Null

        [IO.File]::WriteAllBytes((Join-Path $harness ''Invoke-WindowsToolContracts.ps1''),[Convert]::FromBase64String(''''))

        [IO.File]::WriteAllBytes((Join-Path $harness ''windows_tool_contracts.py''),[Convert]::FromBase64String(''''))

        [IO.File]::WriteAllBytes((Join-Path $harness ''wtc_guard.py''),[Convert]::FromBase64String(''''))

        $stateParent = Join-Path $env:RUNNER_TEMP ''luheng-tool-contract-private''

        New-Item -ItemType Directory -Force $stateParent | Out-Null

        $package = Join-Path $env:RUNNER_TEMP ''luheng-verified-portable/Luheng-Windows-x64''

        & (Join-Path $harness ''Invoke-WindowsToolContracts.ps1'') -PackageRoot $package -RuntimeManifest (Join-Path $package ''resources/agent-payload/manifest.json'') -StateParent $stateParent

        if ($LASTEXITCODE) { throw ''Native Windows tool contracts failed'' }'
    - name: Preserve exact portable and native contract diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-portable-and-tool-contract-evidence
        path: '${{ runner.temp }}/luheng-portable-evidence

          ${{ runner.temp }}/luheng-tool-contract-private/*/summary.json

          ${{ runner.temp }}/luheng-tool-contract-private/*/results/**

          '
        compression-level: 6
        retention-days: 7
        include-hidden-files: true
        if-no-files-found: warn
    - name: Preserve only the byte-qualified portable archive
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-byte-qualified-windows-portable
        path: ${{ runner.temp }}/luheng-portable-product/**
        compression-level: 0
        retention-days: 7
        if-no-files-found: warn
'on':
  push:
    branches:
    - probe/hermes-native-package-current-20261006
    paths:
    - .github/workflows/hermes-native-package-experiment.yml
  workflow_dispatch: null
