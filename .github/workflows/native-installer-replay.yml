name: Replay exact retained unsigned installer with native lifecycle diagnostics
'on':
  push:
    branches:
    - probe/hermes-native-package-current-20261006
    paths:
    - .github/workflows/native-installer-replay.yml
    - qa/native-installer-replay/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: luheng-exact-native-installer-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-native-installer-replay:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
    - name: Checkout current reviewed lifecycle and replay admission
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        ref: ${{ github.sha }}
        path: consumer
        persist-credentials: false
    - name: Select independent admission interpreter
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.12'
    - name: Native ownership observation and inventory preflight before downloads
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $consumer = Join-Path $env:GITHUB_WORKSPACE 'consumer/qa/native-installer-consumer'
        $replay = Join-Path $env:GITHUB_WORKSPACE 'consumer/qa/native-installer-replay'
        $out = Join-Path $env:RUNNER_TEMP 'luheng-nsis-replay/evidence'
        New-Item -ItemType Directory -Force $out | Out-Null
        foreach ($file in @('Invoke-InstallerLifecycle.ps1', 'Test-LifecycleProcessOwner.ps1', 'Observe-InstallerLifecycle.ps1', 'Test-LifecycleObservation.ps1', 'token-review/Run-RestrictedLifecycle.ps1')) {
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $consumer $file), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; throw "PowerShell syntax failed: $file" }
        }
        $tokens = $null; $errors = $null
        [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $replay 'admit_replay.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
        if ($errors.Count) { $errors | Format-List; throw 'Replay admission PowerShell syntax failed' }
        & (Join-Path $consumer 'Test-LifecycleProcessOwner.ps1') -OutputDirectory $out
        & (Join-Path $consumer 'Test-LifecycleObservation.ps1') -OutputDirectory "$out/observation-selftest"
        foreach ($test in @('selftest_verifier.py', 'selftest_inventory_installed.py')) {
          python -I -S -B (Join-Path $consumer $test)
          if ($LASTEXITCODE) { throw "Synthetic consumer preflight failed: $test" }
        }
        python -I -S -B (Join-Path $replay 'selftest_replay.py') --consumer $consumer
        if ($LASTEXITCODE) { throw 'Synthetic exact replay regression failed' }
    - name: Admit exact failed builder successful wrapping and three retained artifacts
      id: admit
      shell: pwsh
      env:
        READ_TOKEN: ${{ github.token }}
      run: |
        & ./consumer/qa/native-installer-replay/admit_replay.ps1 `
          -ReplayContract ./consumer/qa/native-installer-replay/replay-contract.json `
          -ConsumerDirectory ./consumer/qa/native-installer-consumer `
          -JobRoot "${{ runner.temp }}/luheng-nsis-replay"
    - name: Download exact small original source evidence with fatal digest checks
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.admit.outputs.source-evidence-id }}
        run-id: ${{ steps.admit.outputs.source-run }}
        repository: jobKKB/luheng-highway-agent
        github-token: ${{ github.token }}
        digest-mismatch: error
        merge-multiple: true
        path: ${{ runner.temp }}/luheng-nsis-replay/original-evidence
    - name: Download exact small builder evidence with fatal digest checks
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.admit.outputs.builder-evidence-id }}
        run-id: ${{ steps.admit.outputs.builder-run }}
        repository: jobKKB/luheng-highway-agent
        github-token: ${{ github.token }}
        digest-mismatch: error
        merge-multiple: true
        path: ${{ runner.temp }}/luheng-nsis-replay/builder-evidence
    - name: Verify original receipt bytes and source custody before large EXE download
      shell: pwsh
      run: |
        $job = Join-Path $env:RUNNER_TEMP 'luheng-nsis-replay'
        python -I -S -B ./consumer/qa/native-installer-replay/verify_replay.py evidence `
          --consumer ./consumer/qa/native-installer-consumer `
          --contract ./consumer/qa/native-installer-replay/replay-contract.json `
          --source-contract ./consumer/qa/native-installer-consumer/contract.json `
          --api-root "$job/evidence" --builder-evidence "$job/builder-evidence" `
          --source-evidence "$job/original-evidence" --output "$job/evidence/replay-evidence-admission.json"
        if ($LASTEXITCODE) { throw 'Frozen original receipt or source custody differs' }
    - name: Download exact retained EXE with fatal digest checks and no rebuild
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        artifact-ids: ${{ steps.admit.outputs.candidate-id }}
        run-id: ${{ steps.admit.outputs.builder-run }}
        repository: jobKKB/luheng-highway-agent
        github-token: ${{ github.token }}
        digest-mismatch: error
        merge-multiple: true
        path: ${{ runner.temp }}/luheng-nsis-replay/candidate
    - name: Bind exact inner EXE preserve original receipts and relocate only installer path
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $job = Join-Path $env:RUNNER_TEMP 'luheng-nsis-replay'
        python -I -S -B ./consumer/qa/native-installer-replay/verify_replay.py downloads `
          --consumer ./consumer/qa/native-installer-consumer `
          --contract ./consumer/qa/native-installer-replay/replay-contract.json `
          --source-contract ./consumer/qa/native-installer-consumer/contract.json `
          --api-root "$job/evidence" --builder-evidence "$job/builder-evidence" `
          --source-evidence "$job/original-evidence" --candidate "$job/candidate" `
          --output "$job/evidence/replay-download-admission.json"
        if ($LASTEXITCODE) { throw 'Exact replay bytes not admitted; do not execute' }
        $pins = Get-Content ./consumer/qa/native-installer-replay/replay-contract.json -Raw | ConvertFrom-Json
        $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($job).TrimEnd('\').TrimEnd(':'))
        $remaining = 2 * [long]$pins.scratchBudgetBasis.payloadBytes + [long]$pins.scratchBudgetBasis.reserveBytes
        @{free_bytes=[long]$drive.Free; minimum_remaining_bytes=$remaining} | ConvertTo-Json | Set-Content "$job/evidence/replay-disk-before-install.json" -Encoding utf8
        if ($drive.Free -lt $remaining) { throw 'Insufficient remaining scratch for two expanded copies' }
    - name: Replay exact EXE with current guarded install inventory launch and uninstall
      id: lifecycle
      shell: pwsh
      run: |
        $job = Join-Path $env:RUNNER_TEMP 'luheng-nsis-replay'
        & ./consumer/qa/native-installer-consumer/Invoke-InstallerLifecycle.ps1 `
          -Contract ./consumer/qa/native-installer-consumer/contract.json `
          -BuildReceipt "$job/evidence/installer-build.relocated.json" `
          -OriginalEvidence "$job/original-evidence" -JobRoot $job `
          -Verifier ./consumer/qa/native-installer-consumer/verify_consumer.py `
          -PythonExecutable (Get-Command python -ErrorAction Stop).Source
    - name: Independently require complete current native acceptance
      id: accepted
      shell: pwsh
      run: |
        $job = Join-Path $env:RUNNER_TEMP 'luheng-nsis-replay'
        python -I -S -B ./consumer/qa/native-installer-replay/verify_replay.py acceptance `
          --consumer ./consumer/qa/native-installer-consumer `
          --contract ./consumer/qa/native-installer-replay/replay-contract.json `
          --source-contract ./consumer/qa/native-installer-consumer/contract.json `
          --evidence-root "$job/evidence" --current-run $env:GITHUB_RUN_ID `
          --output "$job/evidence/replay-acceptance.json"
        if ($LASTEXITCODE) { throw 'Replay lifecycle incomplete; no qualified installer upload' }
    - name: Preserve replay diagnostics and admission evidence even on failure
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-exact-installer-replay-evidence
        path: ${{ runner.temp }}/luheng-nsis-replay/evidence/**
        include-hidden-files: true
        compression-level: 6
        retention-days: 14
        if-no-files-found: warn
    - name: Preserve exact installer only after every current acceptance gate passes
      if: success() && steps.lifecycle.outcome == 'success' && steps.accepted.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: luheng-unsigned-manual-native-nsis-replayed-test
        path: ${{ runner.temp }}/luheng-nsis-replay/candidate/Luheng-Unsigned-Manual-Test-0.0.0-x64.exe
        compression-level: 0
        retention-days: 14
        if-no-files-found: error
